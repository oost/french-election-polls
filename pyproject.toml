[project]
name = "french-elections"
version = "0.1.0"
description = "French election polling analysis and FiftyPlusOne-style forecasts"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.8",
    "pandas>=2.2",
    "numpy>=2.0",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pyarrow>=16",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
stan = ["cmdstanpy>=1.2"]
xlsx = ["openpyxl>=3.1"]
dev = ["pytest>=8"]
docs = ["markdown>=3.5", "pygments>=2.17"]
pdf = ["reportlab>=4.2"]

[tool.setuptools]
packages = ["forecast"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["test_polls_helpers.py", "tests"]
addopts = "-m 'not slow and not network'"
markers = [
    "slow: compiles or samples Stan models (needs cmdstanpy + CmdStan)",
    "network: downloads live data (Wikipedia, data.gouv.fr)",
]
